<div class="admin-users-container">
  <h1>Gestione Utenti</h1>

  <!-- Tasto indietro retro -->
  <div class="back-button-wrapper">
    <button class="back-btn" (click)="goBack()">← Torna alla Dashboard</button>
  </div>

  <h1>Gestione Utenti</h1>


  <!-- Controlli paginazione -->
  <div class="pagination-controls">
    <button (click)="previousPage()" [disabled]="currentPage === 0">⬅️ Indietro</button>
    <span>Pagina {{ currentPage + 1 }} / {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="currentPage >= totalPages - 1">➡️ Avanti</button>

    <label>
      Mostra:
      <select [(ngModel)]="pageSize" (change)="onChangePageSize(pageSize)">
        <option [value]="5">5</option>
        <option [value]="10">10</option>
        <option [value]="25">25</option>
      </select>
      utenti per pagina
    </label>
  </div>

  <!-- Tabella utenti -->
  <table class="users-table">
    <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Email</th>
      <th>Ruolo</th>
      <th>Telefono</th>
      <th>Indirizzo</th>
      <th>Azioni</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>{{ user.phone }}</td>
      <td>{{ user.address }}</td>
      <td>
        <button class="action-btn edit" (click)="onEdit(user)">Aggiorna</button>
        <button class="action-btn delete" (click)="onDelete(user)">Elimina</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Modale aggiornamento -->
  <div *ngIf="editingUser" class="modal-overlay">
    <div class="modal">
      <h2>Aggiorna Utente: {{ editingUser.username }}</h2>
      <form (ngSubmit)="onSubmitUpdate()">
        <div class="form-group">
          <label for="phone">Telefono:</label>
          <input id="phone" type="text" [(ngModel)]="editingUser.phone" name="phone" required />
        </div>
        <div class="form-group">
          <label for="address">Indirizzo:</label>
          <input id="address" type="text" [(ngModel)]="editingUser.address" name="address" required />
        </div>
        <div class="modal-actions">
          <button type="submit" class="action-btn save">Salva</button>
          <button type="button" class="action-btn cancel" (click)="cancelEdit()">Annulla</button>
        </div>
      </form>
    </div>
  </div>
</div>
