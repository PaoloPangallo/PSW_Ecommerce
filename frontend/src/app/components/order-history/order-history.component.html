<h2>📦 Storico Ordini</h2>

<!-- Mostriamo un messaggio di caricamento -->
<div *ngIf="isLoading">Caricamento...</div>

<!-- Mostriamo errori in rosso -->
<div *ngIf="error" class="error-message">{{ error }}</div>

<!-- Se non ci sono ordini -->
<div *ngIf="!isLoading && orders.length === 0" class="no-orders">
  ❌ Nessun ordine trovato.
</div>

<!-- Tabella con gli ordini -->
<table mat-table [dataSource]="orders" class="mat-elevation-z8" *ngIf="orders.length > 0">
  <!-- ID Ordine -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let order">{{ order.id }}</td>
  </ng-container>

  <!-- Totale -->
  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Totale</th>
    <td mat-cell *matCellDef="let order">{{ order.total | number:'1.2-2' }} L</td>
  </ng-container>

  <!-- Data Ordine -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Data</th>
    <td mat-cell *matCellDef="let order">{{ order.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>

  <!-- Azioni -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Azioni</th>
    <td mat-cell *matCellDef="let order">
      <!-- Link alla rotta 'orders/:id' -->
      <button mat-button color="primary" [routerLink]="['/orders', order.id]">
        Dettagli
      </button>
    </td>
  </ng-container>

  <!-- Intestazioni -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <!-- Righe -->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
