<h2>📦 Storico Ordini</h2>

<!-- Stato di caricamento -->
<div *ngIf="isLoading">Caricamento...</div>

<!-- Mostra errori -->
<div *ngIf="error" class="error-message">{{ error }}</div>

<!-- Se non ci sono ordini -->
<div *ngIf="!isLoading && orders.length === 0" class="no-orders">
  ❌ Nessun ordine trovato.
</div>

<!-- Tabella degli ordini -->
<table mat-table [dataSource]="orders" class="mat-elevation-z8" *ngIf="orders.length > 0">
  <!-- Colonna ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let order">{{ order.id }}</td>
  </ng-container>

  <!-- Colonna Totale -->
  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Totale</th>
    <td mat-cell *matCellDef="let order">{{ order.total | number:'1.2-2' }} L</td>
  </ng-container>

  <!-- Colonna Data -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Data</th>
    <td mat-cell *matCellDef="let order">{{ order.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>

  <!-- Colonna Azioni -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Azioni</th>
    <td mat-cell *matCellDef="let order">
      <button mat-button color="primary" [routerLink]="['/orders', order.id]">
        Dettagli
      </button>
    </td>
  </ng-container>

  <!-- Righe della tabella -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- Controlli di paginazione -->
<div class="pagination-controls" *ngIf="orders.length > 0">
  <button mat-button (click)="goToPreviousPage()" [disabled]="currentPage === 0">
    Precedente
  </button>
  <span>Pagina {{ currentPage + 1 }} di {{ totalPages }}</span>
  <button mat-button (click)="goToNextPage()" [disabled]="currentPage >= totalPages - 1">
    Successivo
  </button>
</div>
