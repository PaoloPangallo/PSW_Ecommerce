<h2>Lista Utenti</h2>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Username</th>
    <th>Email</th>
    <th>Ruolo</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let user of users">
    <td>{{ user.id }}</td>
    <td>{{ user.username }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.role }}</td>
  </tr>
  </tbody>
</table>

<div class="pagination-controls">
  <button (click)="previousPage()" [disabled]="currentPage === 0">⬅️ Indietro</button>
  <span>Pagina {{ currentPage + 1 }} / {{ totalPages }}</span>
  <button (click)="nextPage()" [disabled]="currentPage >= totalPages - 1">➡️ Avanti</button>
</div>
