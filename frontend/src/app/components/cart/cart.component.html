<mat-card class="cart-wrapper" *ngIf="cart && cart.items.length > 0; else emptyCart">
  <mat-card-title>Il tuo Carrello</mat-card-title>
  <mat-card-content>
    <table mat-table [dataSource]="cart.items" class="mat-elevation-z8">
      <!-- Colonna Prodotto -->
      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef>Prodotto</th>
        <td mat-cell *matCellDef="let item">{{ item.productName }}</td>
      </ng-container>

      <!-- Colonna Quantità -->
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Quantità</th>
        <td mat-cell *matCellDef="let item">
          <button mat-icon-button color="primary" (click)="decreaseQuantity(item.productId, item.quantity)">
            <mat-icon>remove</mat-icon>
          </button>
          <span>{{ item.quantity }}</span>
          <button mat-icon-button color="primary" (click)="increaseQuantity(item.productId, item.quantity)">
            <mat-icon>add</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Colonna Prezzo Unitario -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Prezzo Unitario</th>
        <td mat-cell *matCellDef="let item">
          <ng-container *ngIf="item.oldPrice && item.oldPrice > item.price; else normalPrice">
            <del class="old-price">{{ item.oldPrice | lire }}</del>
            <span class="new-price">{{ item.price | lire }}</span>
          </ng-container>
          <ng-template #normalPrice>
            {{ item.price | lire }}
          </ng-template>
        </td>
      </ng-container>


      <!-- Colonna Totale per Prodotto -->
      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Totale</th>
        <td mat-cell *matCellDef="let item">{{ (item.price * item.quantity) | lire }}</td>
      </ng-container>

      <!-- Colonna Coupon -->
      <ng-container matColumnDef="coupon">
        <th mat-header-cell *matHeaderCellDef>Coupon</th>
        <td mat-cell *matCellDef="let item">
          <input placeholder="Incolla Codice Coupon" [(ngModel)]="couponCodes[item.id]" name="coupon{{item.id}}" />
          <button mat-button color="primary" (click)="applyCoupon(item.id)">Applica</button>
        </td>
      </ng-container>

      <!-- Colonna Azioni -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Azioni</th>
        <td mat-cell *matCellDef="let item">
          <button mat-button color="warn" (click)="remove(item.productId)">Rimuovi</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Totale Ordine -->
    <div class="cart-total">
      <p><strong>Totale Ordine:</strong> {{ getTotalPrice() | lire }}</p>
    </div>

    <!-- Pulsante per svuotare il carrello -->
    <div class="clear-btn-container">
      <button mat-raised-button color="accent" (click)="clear()">Svuota carrello</button>
    </div>
  </mat-card-content>
</mat-card>

<div class="cart-summary" *ngIf="cart && cart.items.length > 0">
  <button mat-raised-button color="primary" (click)="goToCheckout()">Procedi al Checkout</button>
</div>

<ng-template #emptyCart>
  <mat-card class="cart-wrapper">
    <mat-card-content>
      <p>Il carrello è vuoto.</p>
    </mat-card-content>
  </mat-card>
</ng-template>
