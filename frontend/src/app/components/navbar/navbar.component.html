<!-- ╔═══════════════════════════════════════════╗
     ║               NAVBAR RETRO               ║
     ╚═══════════════════════════════════════════╝ -->
<nav class="navbar">
  <div class="nav-top">

    <!-- ① USER AREA (icone a sinistra) -->
    <div class="user-area">
      <a (click)="handleAccount()">👤 Account</a>
      <a routerLink="/cart">🛒 Carrello</a>
      <a routerLink="/wishlist">❤️ Wishlist</a>
      <a *ngIf="isLoggedIn()" routerLink="/order-history">📦 Ordini</a>
      <a *ngIf="isLoggedIn()" (click)="logout()" style="cursor:pointer">🚪 Logout</a>
    </div>

    <!-- ② PULSANTE ADMIN (al centro) -->
    <div class="admin-area">
      <button
        *ngIf="authService.isAdmin()"
        class="admin-btn"
        routerLink="/admin">
        Console Admin
      </button>
    </div>

    <!-- ③ LOGO + SEARCH (a destra) -->
    <div class="brand-area">
      <a routerLink="/" class="logo">
        <img
          ngSrc="assets/logo_unilire.svg"
          alt="Unilire"
          width="200"
          height="60"
        />
      </a>

      <div
        class="search-box"
        tabindex="0"
        (focusout)="onFocusOut($event)"
      >
        <input
          [formControl]="searchControl"
          type="text"
          placeholder="Cerca un prodotto…"
        />

        <!-- LOADING -->
        <div class="spinner" *ngIf="isLoading"></div>

        <!-- RISULTATI -->
        <ul
          class="search-suggestions"
          *ngIf="isDropdownOpen && searchResults.length > 0"
        >
          <li
            *ngFor="let product of searchResults"
            (click)="onSelectProduct(product)"
          >
            <img [src]="product.imageUrl" [alt]="product.name" />
            <div class="info">
              <span class="name">{{ product.name }}</span>
              <span class="price">
                {{ product.price | number: '1.0-0' }} L
              </span>
            </div>
          </li>
        </ul>

        <!-- NESSUN RISULTATO -->
        <div class="no-results" *ngIf="noResults">
          Nessun prodotto trovato
        </div>
      </div>
    </div>
  </div>
</nav>
