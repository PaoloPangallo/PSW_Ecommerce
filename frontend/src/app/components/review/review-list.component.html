<div class="review-list-container" *ngIf="!isLoading; else loadingTemplate">
  <h3>Recensioni</h3>

  <div *ngIf="reviews.length > 0; else noReviews">
    <mat-card *ngFor="let review of reviews" class="review-card">
      <mat-card-header>
        <mat-card-title>{{ review.userName }}</mat-card-title>
        <mat-card-subtitle>{{ review.createdDate | date:'short' }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>Rating: {{ review.rating }} / 5</p>
        <p>{{ review.comment }}</p>
      </mat-card-content>
      <mat-card-actions>
        <!-- Mostra "Modifica" solo se l'utente corrente è il proprietario della recensione -->
        <button class="btn-edit" *ngIf="review.userId === (currentUserId ?? 0)" (click)="onUpdateReview(review)">
          Modifica
        </button>
        <!-- Mostra "Elimina" solo se l'utente corrente è il proprietario della recensione -->
        <button class="btn-delete" *ngIf="review.userId === (currentUserId ?? 0)" (click)="onDeleteReview(review.id)">
          Elimina
        </button>

        <!-- Componente per gestire gli upvote -->
        <app-review-upvote
          [reviewId]="review.id"
          [userId]="currentUserId ?? 0"
          [initialUpvotes]="review.upvotesCount"
          [hasUpvotedInitial]="review.hasUpvoted">
        </app-review-upvote>
      </mat-card-actions>
    </mat-card>
  </div>

  <ng-template #noReviews>
    <p>Nessuna recensione disponibile per questo prodotto.</p>
  </ng-template>
</div>

<ng-template #loadingTemplate>
  <div class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
