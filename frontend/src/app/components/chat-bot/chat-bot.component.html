<div class="chat-container">

  <!-- ✅ DOMANDE FREQUENTI -->
  <div class="faq-box">
    <p class="faq-title">❓ Domande frequenti</p>
    <div class="faq-buttons">
      <button *ngFor="let q of faqQuestions" (click)="sendFAQ(q)">
        {{ q }}
      </button>
    </div>
  </div>

  <div class="chat-box">
    <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="msg.sender">
      <div class="message">

        <!-- Bottoni suggeriti -->
        <div class="suggested-buttons" *ngIf="msg.buttons?.length">
          <a *ngFor="let b of msg.buttons" [routerLink]="b.link" class="suggestion-btn">
            {{ b.label }}
          </a>
        </div>

        <ng-container *ngIf="msg.sender === 'bot'; else userBlock">
          <ng-container *ngIf="splitResponse(msg.text).intent; else simpleBot">
            <p><strong>🤖 LLaMA:</strong><br>{{ splitResponse(msg.text).llama }}</p>
            <p class="intent"><strong>🎯 Intento:</strong><br>{{ splitResponse(msg.text).intent }}</p>
          </ng-container>
          <ng-template #simpleBot>
            <p><strong>🤖 Bot:</strong> {{ msg.text }}</p>
          </ng-template>
        </ng-container>
        <ng-template #userBlock>
          <p><strong>👤 Tu:</strong> {{ msg.text }}</p>
        </ng-template>
      </div>
    </div>
    <div #chatEnd></div>
  </div>

  <div *ngIf="isLoading" class="loading">⏳ Sto pensando...</div>

  <!-- ✅ INPUT CHAT SEMPRE VISIBILE -->
  <div class="chat-bottom">
    <button (click)="clearChat()" class="clear-btn">🗑️</button>
    <input [(ngModel)]="userMessage" placeholder="Scrivi un messaggio..." (keyup.enter)="sendMessage()" />
    <button (click)="sendMessage()">Invia</button>
  </div>

</div>
