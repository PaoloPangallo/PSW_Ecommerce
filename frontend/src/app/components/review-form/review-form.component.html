<div class="review-form-wrapper">
  <div class="review-form-card">
    <header class="review-form-header">
      <h3>Lascia una Recensione</h3>
      <p>Facci sapere la tua opinione sul prodotto!</p>
    </header>

    <!-- Messaggi di successo o errore -->
    <div *ngIf="successMessage" class="message success-message">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="message error-message">
      {{ errorMessage }}
    </div>

    <form [formGroup]="reviewForm" (ngSubmit)="submitReview()" class="review-form">
      <!-- Valutazione (rating) -->
      <div class="form-group">
        <label for="rating" class="form-label">Valutazione:</label>
        <select id="rating" formControlName="rating" class="form-control">
          <option [value]="null" disabled selected>Seleziona un voto</option>
          <option *ngFor="let num of [1, 2, 3, 4, 5]" [value]="num">
            {{ num }} ★
          </option>
        </select>
        <div
          *ngIf="reviewForm.get('rating')?.invalid && reviewForm.get('rating')?.touched"
          class="error-text"
        >
          La valutazione è obbligatoria e deve essere tra 1 e 5.
        </div>
      </div>

      <!-- Commento -->
      <div class="form-group">
        <label for="comment" class="form-label">Commento:</label>
        <textarea
          id="comment"
          formControlName="comment"
          rows="4"
          class="form-control"
          placeholder="Scrivi qui la tua recensione..."
        ></textarea>
        <div
          *ngIf="reviewForm.get('comment')?.invalid && reviewForm.get('comment')?.touched"
          class="error-text"
        >
          Il commento è obbligatorio (max 1000 caratteri).
        </div>
      </div>

      <!-- Bottone di invio -->
      <button type="submit" class="btn-submit" [disabled]="reviewForm.invalid">
        Invia Recensione
      </button>
    </form>
  </div>
</div>
