<section class="recommendations-section" *ngIf="recommendedProducts.length > 0">
  <h2>Consigliati per te</h2>
  <div class="recommended-grid">
    <div class="recommended-card" *ngFor="let product of recommendedProducts">
      <img [src]="product.imageUrl" [alt]="product.name" />
      <h3>{{ product.name }}</h3>
      <p class="price">Prezzo: {{ product.price | lire:false }}</p>
      <button [routerLink]="['/product', product.id]">Dettagli</button>
    </div>
  </div>
</section>
