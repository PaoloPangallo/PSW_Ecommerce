<div class="coupon-list">
  <h2>Coupon List</h2>
  <ul>
    <li *ngFor="let coupon of coupons">
      <strong>{{ coupon.code }}</strong>
      <span class="discount">{{ coupon.discountPercentage }}% Off</span>
      <span class="expiration">Expires: {{ coupon.expirationDate | date:'short' }}</span>
      <span
        class="active"
        [ngClass]="coupon.isActive ? 'yes' : 'no'">
        Active: {{ coupon.isActive ? 'Yes' : 'No' }}
      </span>
      <span class="min-order">Min Order: €{{ coupon.minOrderValue | number:'1.2-2' }}</span>
    </li>
  </ul>
</div>
