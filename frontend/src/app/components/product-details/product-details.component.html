<div *ngIf="isLoading">
  <p>Caricamento in corso...</p>
</div>

<div *ngIf="!isLoading && product">
  <h2>{{ product.name }}</h2>
  <!-- Se hai un'immagine, ad esempio: -->
  <img *ngIf="product.imageUrl" [src]="product.imageUrl" alt="{{ product.name }}">
  <p>{{ product.description }}</p>
  <p>Prezzo: {{ product.price | currency:'EUR' }}</p>
  <button (click)="addToCart()">Aggiungi al Carrello</button>
</div>

<div *ngIf="!isLoading && !product">
  <p>Prodotto non trovato.</p>
</div>

<button (click)="goBack()">Indietro</button>
