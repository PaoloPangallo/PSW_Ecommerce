<div class="product-section">
  <h2>Lista Prodotti</h2>

  <!-- Messaggio di successo -->
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <!-- Messaggio se non ci sono prodotti -->
  <div *ngIf="!isLoading && products.length === 0">
    <p class="empty-message">Nessun prodotto disponibile.</p>
  </div>

  <!-- Stato di caricamento -->
  <div *ngIf="isLoading" class="loading-message">
    Caricamento prodotti in corso...
  </div>

  <!-- Griglia prodotti -->
  <div class="product-list-container" *ngIf="!isLoading && products.length > 0">
    <div *ngFor="let product of products" class="product-card">
      <img [src]="product.imageUrl" [alt]="product.name" />
      <h2>{{ product.name }}</h2>
      <p class="description">{{ product.description }}</p>
      <p class="price"><strong>Prezzo:</strong> {{ product.price }} L</p>
      <p class="stock"><strong>Disponibilità:</strong> {{ product.stock }}</p>

      <div class="button-container">
        <button class="details-button" [routerLink]="['/product', product.id]">
          🔍 Dettagli
        </button>
        <button class="cart-button" (click)="addToCart(product)">
          🛒 Aggiungi al Carrello
        </button>
      </div>
    </div>
  </div>

  <!-- Paginazione -->
  <div class="pagination-controls" *ngIf="totalPages > 1">
    <button (click)="prevPage()" [disabled]="page === 0">« Indietro</button>
    <span>Pagina {{ page + 1 }} di {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="page + 1 >= totalPages">Avanti »</button>
  </div>
</div>
